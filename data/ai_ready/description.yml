citation: PNSN & University of Washington Earth and Space Sciences PNWML benchmark
  dataset.
label_source: Cataloged PNSN analyst pick labels and magnitude determinations.
license: CC-BY-4.0
missing_data_policy: Rows with null coordinates or invalid magnitudes were dropped.
  Traces containing NaNs, Infs, or flatlined dead channels are rejected.
name: PNWML Seismic Dataset (AI-Ready Subsampled Set)
number_of_independent_units:
  events: 8055
  networks: 6
  stations: 281
partition_definitions:
  split_axis: Spatiotemporal / Station holdout (B7)
  test: 10% held-out geographic station region/time window
  train: 80% of independent stations
  validation: 10% of independent stations
provenance: Pacific Northwest Seismic Network (PNSN) / UW Seismology Lab
sampling:
  duration_seconds: 15
  num_samples_per_trace: 1500
  rate_hz: 100
variables:
  source_magnitude:
    description: Earthquake moment/local magnitude
    dtype: float32
    units: magnitude units
  station_latitude_deg:
    description: Seismic station latitude
    dtype: float64
    units: degrees_north
  station_longitude_deg:
    description: Seismic station longitude
    dtype: float64
    units: degrees_east
  trace_data:
    description: 3-component waveform ground motion acceleration/velocity traces
    dtype: float32
    shape: '[3, 1500]'
    units: counts
version: 1.0.0
